definitions:
  entity.AddSysAdminDto:
    properties:
      deptId:
        type: integer
      email:
        type: string
      nickname:
        type: string
      note:
        type: string
      password:
        type: string
      phone:
        type: string
      postId:
        type: integer
      roleId:
        type: integer
      status:
        type: integer
      username:
        type: string
    required:
    - deptId
    - email
    - nickname
    - password
    - phone
    - postId
    - roleId
    - status
    - username
    type: object
  entity.AddSysRoleDto:
    properties:
      description:
        type: string
      roleKey:
        type: string
      roleName:
        type: string
      status:
        type: integer
    type: object
  entity.BatchSysOperateDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.DelSysPostDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.DeleteLoginInfoDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.LoginDto:
    properties:
      idKey:
        description: uuid
        type: string
      image:
        description: 验证码
        maxLength: 6
        minLength: 4
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - idKey
    - image
    - password
    - username
    type: object
  entity.ResetSysAdminPasswordDto:
    properties:
      id:
        type: integer
      password:
        type: string
    type: object
  entity.RoleMenu:
    properties:
      id:
        type: integer
      menuIds:
        items:
          type: integer
        type: array
    required:
    - id
    - menuIds
    type: object
  entity.SysAdminIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysDept:
    properties:
      children:
        description: -表示不和数据库字段相关联
        items:
          $ref: '#/definitions/entity.SysDept'
        type: array
      createTime:
        $ref: '#/definitions/util.HTime'
      deptName:
        type: string
      deptStatus:
        type: integer
      deptType:
        type: integer
      id:
        type: integer
      parentId:
        type: integer
    type: object
  entity.SysDeptDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysLoginInfoIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysMenu:
    properties:
      children:
        items:
          $ref: '#/definitions/entity.SysMenu'
        type: array
      createTime:
        $ref: '#/definitions/util.HTime'
      icon:
        type: string
      id:
        type: integer
      menuName:
        type: string
      menuStatus:
        type: integer
      menuType:
        type: integer
      parentId:
        type: integer
      sort:
        type: integer
      url:
        type: string
      value:
        type: string
    type: object
  entity.SysMenuIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysOperateIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysPost:
    properties:
      createTime:
        $ref: '#/definitions/util.HTime'
      id:
        type: integer
      postCode:
        type: string
      postName:
        type: string
      postStatus:
        type: integer
      remark:
        type: string
    type: object
  entity.SysPostIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysRoleIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.UpdateSysAdminDto:
    properties:
      deptId:
        type: integer
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      note:
        type: string
      phone:
        type: string
      postId:
        type: integer
      roleId:
        type: integer
      status:
        type: integer
      username:
        type: string
    type: object
  entity.UpdateSysAdminStatusDto:
    properties:
      id:
        type: integer
      status:
        type: integer
    type: object
  entity.UpdateSysPostStatusDto:
    properties:
      id:
        type: integer
      postStatus:
        type: integer
    type: object
  entity.UpdateSysRoleDto:
    properties:
      description:
        type: string
      id:
        type: integer
      roleKey:
        type: string
      roleName:
        type: string
      status:
        type: integer
    type: object
  entity.UpdateSysRoleStatusDto:
    properties:
      id:
        type: integer
      status:
        type: integer
    type: object
  entity.UpdateUserDto:
    properties:
      email:
        type: string
      icon:
        type: string
      id:
        type: integer
      nickname:
        type: string
      note:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  entity.UpdateUserPasswordDto:
    properties:
      id:
        type: integer
      newPassword:
        type: string
      password:
        type: string
      resetPassword:
        type: string
    required:
    - newPassword
    - password
    - resetPassword
    type: object
  result.Result:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  util.HTime:
    properties:
      time.Time:
        type: string
    type: object
